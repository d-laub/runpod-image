name: Docker image

# Builds run on changes to this repo AND on changes to the upstream shell
# environment (d-laub/dlaub-togo), which the generic image installs at build
# time:
#   - schedule            — daily poll; needs no cross-repo credentials, and is
#                           a true no-op when upstream hasn't moved.
#   - repository_dispatch — instant path, fired by a workflow in dlaub-togo.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 7 * * *"
  repository_dispatch:
    types: [dlaub-togo-updated]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Stage 0 — resolve the upstream dlaub-togo commit this build will install,
  # and decide whether a scheduled run has anything to do.
  #
  # Pinning matters for more than provenance: the install is a single
  # `RUN bash /tmp/setup_bash.sh` layer, so without an input that tracks
  # upstream the GHA layer cache would hand back the stale layer and a
  # "rebuild" would republish the old shell environment.
  resolve:
    concurrency:
      group: docker-image-${{ github.workflow }}-${{ github.ref }}-resolve
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      togo_sha: ${{ steps.togo.outputs.sha }}
      build_id: ${{ steps.togo.outputs.build_id }}
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - name: Image name (Docker requires lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # build_id addresses an image by BOTH of its inputs, so a per-commit tag
      # stays immutable even though upstream can now trigger a rebuild of the
      # same repo commit.
      - name: Resolve dlaub-togo HEAD
        id: togo
        run: |
          sha=$(git ls-remote https://github.com/d-laub/dlaub-togo.git refs/heads/main | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::could not resolve d-laub/dlaub-togo main"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build_id=${GITHUB_SHA::7}-t${sha::7}" >> "$GITHUB_OUTPUT"
          echo "dlaub-togo main = $sha"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the scheduled poll can be a no-op. Every other event means this
      # repo (or a human) asked for a build, so it always builds.
      - name: Has anything changed?
        id: probe
        env:
          BUILD_ID: ${{ steps.togo.outputs.build_id }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A probe failure is treated as "absent" — a false negative costs one
          # fully-cached build, a false positive would skip a needed rebuild.
          missing=0
          for variant in gpu cpu; do
            tag="ghcr.io/${IMAGE_NAME}:${variant}-${BUILD_ID}"
            if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
              echo "present: $tag"
            else
              echo "absent:  $tag"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new upstream — skipping build."
          fi

  # Stage 1 — the generic base image. Owns the bare :latest/:gpu/:cpu tags and
  # an immutable per-build :{gpu,cpu}-<build_id> tag that downstream flavors
  # pin to.
  generic:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    concurrency:
      group: docker-image-${{ github.workflow }}-${{ github.ref }}-generic-${{ matrix.variant }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            base_image: runpod/base:1.0.3-cuda1281-ubuntu2404
            # The GPU image is the default flavor, so it alone owns bare :latest.
            extra_tags: type=raw,value=latest,enable={{is_default_branch}}
          - variant: cpu
            base_image: runpod/base:1.0.3-ubuntu2404
            extra_tags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Image name (Docker requires lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login (read+write) even on PRs: downstream flavors need to pull this
      # base image, and pushing is separately gated below.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          # The branch tag carries the variant suffix: without it both matrix
          # legs would race to publish the same `:main` tag.
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}-${{ needs.resolve.outputs.build_id }}
            type=ref,event=branch,suffix=-${{ matrix.variant }}
            ${{ matrix.extra_tags }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: generic
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            DLAUB_TOGO_REF=${{ needs.resolve.outputs.togo_sha }}
          cache-from: type=gha,scope=generic-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=generic-${{ matrix.variant }}

  # Stage 2 — project flavors layered ON TOP of the generic image (FROM it).
  # Each waits for `generic`, then builds against the matching generic variant.
  # A flavor's directory name is its build context and its tag prefix, so
  # adding one means adding one name to `flavor` below.
  flavors:
    needs: [resolve, generic]
    concurrency:
      group: docker-image-${{ github.workflow }}-${{ github.ref }}-${{ matrix.flavor }}-${{ matrix.variant }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [gvf-germ-som]
        variant: [gpu, cpu]
    steps:
      - uses: actions/checkout@v4

      - name: Image name (Docker requires lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve generic base image
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PRs don't push generic — build on the last main generic image.
            echo "BASE_IMAGE=ghcr.io/${IMAGE_NAME}:${{ matrix.variant }}" >> "$GITHUB_ENV"
          else
            # Immutable per-build tag the `generic` job just pushed.
            echo "BASE_IMAGE=ghcr.io/${IMAGE_NAME}:${{ matrix.variant }}-${{ needs.resolve.outputs.build_id }}" >> "$GITHUB_ENV"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.flavor }}-${{ matrix.variant }}
            type=raw,value=${{ matrix.flavor }}-${{ matrix.variant }}-${{ needs.resolve.outputs.build_id }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.flavor }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.flavor }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}-${{ matrix.variant }}
