# Interactive dev pod on a full rtxp6000-8x node, running the same image as
# RunPod. The image's /start.sh is platform-neutral: it dumps the container env
# to /etc/rp_environment (which .bashrc sources) and starts sshd if PUBLIC_KEY
# is set, so the Secret below wires git/rclone/aws/wandb exactly as RunPod
# template secrets do.
#
#   kubectl apply -k coreweave/
#   kubectl exec -it dev -- bash
apiVersion: v1
kind: Pod
metadata:
  name: dev
spec:
  nodeSelector:
    node.kubernetes.io/instance-type: rtxp6000-8x
  restartPolicy: Never
  containers:
    - name: dev
      image: ghcr.io/d-laub/runpod-image:gpu
      imagePullPolicy: Always
      # pod-guard.sh pauses work before a full disk or an OOM kills the pod
      # (see the script). Restarted if it dies; /start.sh stays the main process.
      # `args` replaces only the image's Cmd, keeping nvidia_entrypoint.sh.
      args:
        - /bin/bash
        - -c
        - (while :; do bash /opt/pod-guard/pod-guard.sh; sleep 5; done) & exec /start.sh
      # optional: the pod starts without the Secret, with the matching
      # features inert (same contract as RunPod template secrets).
      # py-spy/gdb on running processes: the node's kernel.yama.ptrace_scope=1
      # only lets a process trace its own descendants without CAP_SYS_PTRACE.
      securityContext:
        capabilities:
          add: [SYS_PTRACE]
      envFrom:
        - secretRef:
            name: runpod-image-secrets
            optional: true
      resources:
        # limits only, so requests == limits. Leaves headroom for the node's
        # daemonsets (~6 CPU, ~20 Gi requested). The node (~1006 Gi) reserves
        # no memory for the system, so 960Gi let the pod starve the kubelet and
        # daemons into a node-wide OOM; 900Gi keeps ~100 Gi free for them.
        limits:
          nvidia.com/gpu: 8
          cpu: "120"
          memory: 900Gi
      ports:
        - { name: ssh, containerPort: 22 }
      volumeMounts:
        - { name: workspace, mountPath: /workspace }
        - { name: dshm, mountPath: /dev/shm }
        - { name: pod-guard, mountPath: /opt/pod-guard }
  volumes:
    - name: workspace
      persistentVolumeClaim: { claimName: workspace }
    # PyTorch DataLoader workers pass batches through /dev/shm; the 64 Mi
    # container default makes them crash with bus errors. Sized to the memory
    # limit, which it counts against: writes reach 25 GiB/s, too fast for
    # pod-guard to catch a smaller tmpfs filling, but its memory check covers
    # shm at any size.
    - name: dshm
      emptyDir: { medium: Memory, sizeLimit: 900Gi }
    - name: pod-guard
      configMap: { name: pod-guard }
